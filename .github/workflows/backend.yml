name: Release Express Backend API

on:
  push:
    branches: ["main"]
    # only when the backend is updated
    paths:
    - backend/**
    - .github/workflows/backend.yml

jobs:
  # verify tests pass before building
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services w/ Docker Compose
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Run prisma generate
        run: docker compose -f docker-compose.test.yml exec -T backend sh -c "npx prisma db push"

      - name: Execute tests inside backend test container
        env:
          GMAIL_HOST: ${{ secrets.GMAIL_HOST }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          docker compose -f docker-compose.test.yml exec -T \
            -e GMAIL_HOST='${{ secrets.GMAIL_HOST }}' \
            -e GMAIL_USER='${{ secrets.GMAIL_USER }}' \
            -e GMAIL_PASS='${{ secrets.GMAIL_PASS }}' \
            backend sh -c "npm run test"

      - name: Stop services
        run: docker compose -f docker-compose.test.yml down -v

  # build and push after tests pass
  build-and-push:
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod-final-stage
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/travioli-backend:latest
