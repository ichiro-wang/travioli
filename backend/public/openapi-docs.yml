openapi: 3.0.0
info:
  title: Backend API
  version: 1.0.0
  description: This is the backend API. This doc was generated on 2025-09-11.
servers:
  - url: http://localhost:5000/api
    description: Backend server
components:
  schemas:
    ResponseMessage:
      type: object
      properties:
        message:
          type: string
      required:
        - message
      description: A simple response with a message
    ErrorResponseMessage:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required:
        - message
      description: A simple error response with a message, and optional array of errors
    InternalServerError:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        errorLocation:
          type: string
      required:
        - message
      description: Internal server error response
    Email:
      type: string
      format: email
      description: A valid email address
      example: lebronjames@gmail.com
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: ^(?!_+$)[a-z0-9_]+$
      description: A username with letters, numbers, and underscores
      example: lebron_james_23
    Password:
      type: string
      minLength: 8
      description: A password with minimum 8 characters
      example: password123
    FilteredUser:
      type: object
      properties:
        id:
          type: string
          format: cuid
          description: User ID
        username:
          $ref: "#/components/schemas/Username"
        name:
          type: string
          nullable: true
          maxLength: 255
          example: LeBron
        bio:
          type: string
          nullable: true
          maxLength: 255
          example: This is my bio
        profilePic:
          type: string
          example: https://profile_picture_link
        isPrivate:
          type: boolean
        email:
          allOf:
            - $ref: "#/components/schemas/Email"
            - nullable: true
      required:
        - id
        - username
        - name
        - bio
        - profilePic
        - isPrivate
        - email
    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/FilteredUser"
      required:
        - user
    CheckUsernameResponse:
      type: object
      properties:
        message:
          type: string
        available:
          type: boolean
      required:
        - message
        - available
    GetUserItinerariesResponse:
      type: object
      properties:
        itineraries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: cuid
              title:
                type: string
              description:
                type: string
                nullable: true
              startDate:
                type: string
                nullable: true
                format: date
              endDate:
                type: string
                nullable: true
                format: date
              currency:
                type: string
              isArchived:
                type: boolean
              ownerId:
                type: string
              createdAt:
                type: string
                nullable: true
                format: date
              updatedAt:
                type: string
                nullable: true
                format: date
            required:
              - id
              - title
              - currency
              - isArchived
              - ownerId
              - createdAt
              - updatedAt
        pagination:
          type: object
          properties:
            loadIndex:
              type: integer
              minimum: 0
            hasMore:
              type: boolean
          required:
            - loadIndex
            - hasMore
      required:
        - itineraries
        - pagination
    GetProfileResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/FilteredUser"
        isSelf:
          type: boolean
        followedByCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        followStatus:
          type: string
          enum:
            - pending
            - accepted
            - notFollowing
      required:
        - user
        - isSelf
        - followedByCount
        - followingCount
    FollowUserResponse:
      type: object
      properties:
        message:
          type: string
        follow:
          type: object
          properties:
            status:
              type: string
              enum:
                - pending
                - accepted
                - notFollowing
            followedById:
              type: string
            followingId:
              type: string
            createdAt:
              type: string
              nullable: true
              format: date
            updatedAt:
              type: string
              nullable: true
              format: date
          required:
            - status
            - followedById
            - followingId
            - createdAt
            - updatedAt
      required:
        - message
        - follow
    GetFollowStatusResponse:
      type: object
      properties:
        followStatus:
          type: string
          enum:
            - pending
            - accepted
            - notFollowing
      required:
        - followStatus
    GetFollowRequestsResponse:
      type: object
      properties:
        pendingRequests:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                enum:
                  - pending
                  - accepted
                  - notFollowing
              followedById:
                type: string
              followingId:
                type: string
              createdAt:
                type: string
                nullable: true
                format: date
              updatedAt:
                type: string
                nullable: true
                format: date
            required:
              - status
              - followedById
              - followingId
              - createdAt
              - updatedAt
      required:
        - pendingRequests
    CreateItineraryResponse:
      type: object
      properties:
        itinerary:
          type: object
          properties:
            id:
              type: string
              format: cuid
            title:
              type: string
            description:
              type: string
              nullable: true
            startDate:
              type: string
              nullable: true
              format: date
            endDate:
              type: string
              nullable: true
              format: date
            currency:
              type: string
            isArchived:
              type: boolean
            ownerId:
              type: string
            createdAt:
              type: string
              nullable: true
              format: date
            updatedAt:
              type: string
              nullable: true
              format: date
            itineraryItems:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: cuid
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  cost:
                    type: number
                    nullable: true
                  currencyOverride:
                    type: string
                    nullable: true
                  order:
                    type: integer
                  itineraryId:
                    type: string
                  createdAt:
                    type: string
                    nullable: true
                    format: date
                  updatedAt:
                    type: string
                    nullable: true
                    format: date
                  location:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: cuid
                      itineraryItemId:
                        type: string
                      country:
                        type: string
                        nullable: true
                      city:
                        type: string
                        nullable: true
                      address:
                        type: string
                        nullable: true
                      coordinates:
                        type: object
                        properties:
                          lat:
                            type: number
                          lng:
                            type: number
                        required:
                          - lat
                          - lng
                    required:
                      - id
                      - itineraryItemId
                      - coordinates
                required:
                  - id
                  - name
                  - order
                  - itineraryId
                  - createdAt
                  - updatedAt
          required:
            - id
            - title
            - currency
            - isArchived
            - ownerId
            - createdAt
            - updatedAt
            - itineraryItems
      required:
        - itinerary
    Date:
      anyOf:
        - type: string
          format: date
        - type: string
    LocationInput:
      type: object
      properties:
        coordinates:
          type: object
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lng:
              type: number
              minimum: -180
              maximum: 180
          required:
            - lat
            - lng
        country:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 255
      required:
        - coordinates
    ItineraryItemInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        cost:
          type: number
        currency:
          type: string
        order:
          type: number
          minimum: 0
        location:
          $ref: "#/components/schemas/LocationInput"
      required:
        - name
        - order
        - location
    UpdateItineraryItemRequest:
      allOf:
        - $ref: "#/components/schemas/ItineraryItemInput"
        - type: object
          properties:
            id:
              type: string
              format: cuid
          required:
            - id
  parameters: {}
paths:
  /auth/signup:
    post:
      description: Signup a user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                username:
                  $ref: "#/components/schemas/Username"
                password:
                  $ref: "#/components/schemas/Password"
                confirmPassword:
                  $ref: "#/components/schemas/Password"
              required:
                - email
                - username
                - password
                - confirmPassword
      responses:
        "201":
          description: User created, check email to complete signup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseMessage"
        "400":
          description: Signup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /auth/login:
    post:
      description: Login a user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                password:
                  $ref: "#/components/schemas/Password"
              required:
                - email
                - password
      responses:
        "200":
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Login failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /auth/logout:
    post:
      description: Logout a user
      responses:
        "200":
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseMessage"
        "400":
          description: "Logout failed: No refresh token secret key. This is a problem with
            environment variable not being set on backend."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "401":
          description: "Logout failed: Invalid token type, This is a problem with an
            access token being attached as a 'refreshToken'."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /auth/verify-email:
    post:
      description: Verify email
      parameters:
        - schema:
            type: string
          required: true
          name: token
          in: query
      responses:
        "200":
          description: Email successfully verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseMessage"
        "404":
          description: Invalid verification token provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /auth/resend-verification-email:
    post:
      description: Resend verification email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  $ref: "#/components/schemas/Email"
              required:
                - email
      responses:
        "200":
          description: Verification email resent. The email is only sent in the case that
            the email exists and is pending verification. If the email does not
            exist or is already verified, no email is sent. Response message are
            same in all cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseMessage"
        "400":
          description: Error in sending email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /auth/me:
    get:
      description: Get me
      responses:
        "200":
          description: Successfully got self
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /auth/refresh:
    get:
      description: Refresh JWT
      responses:
        "200":
          description: Successfully refreshed token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseMessage"
        "400":
          description: No refresh token secret key. This is a problem with environment
            variable not being set on backend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /users/check-username:
    get:
      description: Check if a username is available
      parameters:
        - schema:
            $ref: "#/components/schemas/Username"
          required: true
          description: A username with letters, numbers, and underscores
          name: username
          in: query
      responses:
        "200":
          description: Username is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckUsernameResponse"
        "400":
          description: Check-Username failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "409":
          description: Username taken, or already yours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckUsernameResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /users/{id}/itineraries:
    get:
      description: Get the itineraries of a user
      parameters:
        - schema:
            type: string
            format: cuid
            description: User ID
          required: true
          description: User ID
          name: id
          in: path
        - schema:
            type: string
            description: A positive integer to specify which entries to retrieve for
              pagination
          required: false
          description: A positive integer to specify which entries to retrieve for
            pagination
          name: loadIndex
          in: query
      responses:
        "200":
          description: Retrieved index N of user's itineraries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserItinerariesResponse"
        "400":
          description: Error fetching user's itineraries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "403":
          description: Cannot view user's itineraries as their account is private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "404":
          description: This user was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /users/{id}:
    get:
      description: Get User Profile
      parameters:
        - schema:
            type: string
            format: cuid
            description: User ID
          required: true
          description: User ID
          name: id
          in: path
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProfileResponse"
        "400":
          description: Error retrieving user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /users/me:
    patch:
      description: Update own profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  $ref: "#/components/schemas/Username"
                name:
                  type: string
                  maxLength: 255
                  example: LeBron James
                bio:
                  type: string
                  maxLength: 255
                  example: This is my bio
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/FilteredUser"
                required:
                  - user
        "400":
          description: Error in updating profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
    delete:
      description: Soft delete own account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  $ref: "#/components/schemas/Password"
              required:
                - password
      responses:
        "200":
          description: Successfully (soft) deleted account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    allOf:
                      - $ref: "#/components/schemas/FilteredUser"
                      - type: object
                        properties:
                          isDeleted:
                            type: boolean
                        required:
                          - isDeleted
                required:
                  - user
        "400":
          description: Error deleting account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /follows/{id}:
    get:
      description: Follow a user
      parameters:
        - schema:
            type: string
            format: cuid
            description: User ID
          required: true
          description: User ID
          name: id
          in: path
      responses:
        "200":
          description: Successfully followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUserResponse"
        "201":
          description: Successfully followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUserResponse"
        "400":
          description: Error following user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "404":
          description: "Error following user: User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /follows/{id}/status:
    get:
      description: Check follow status with this user
      parameters:
        - schema:
            type: string
            format: cuid
            description: User ID
          required: true
          description: User ID
          name: id
          in: path
      responses:
        "200":
          description: Successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFollowStatusResponse"
        "400":
          description: Error checking follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "404":
          description: "Error checking follow status: User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
    patch:
      description: Updated follow status of user
      parameters:
        - schema:
            type: string
            format: cuid
            description: User ID
          required: true
          description: User ID
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - accept
                    - reject
                    - remove
                    - cancel
                    - unfollow
              required:
                - type
      responses:
        "200":
          description: Successfully updated follow status
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  follow:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - pending
                          - accepted
                          - notFollowing
                      followedById:
                        type: string
                      followingId:
                        type: string
                      createdAt:
                        type: string
                        nullable: true
                        format: date
                      updatedAt:
                        type: string
                        nullable: true
                        format: date
                    required:
                      - status
                      - followedById
                      - followingId
                      - createdAt
                      - updatedAt
                required:
                  - message
                  - follow
        "400":
          description: Error updating follow status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "404":
          description: "Error updating follow status: No follow relationship exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /follows/{id}/{type}:
    get:
      description: Get following or follower list of a user
      parameters:
        - schema:
            type: string
            format: cuid
            description: User ID
          required: true
          description: User ID
          name: id
          in: path
        - schema:
            type: string
            enum:
              - followedBy
              - following
          required: true
          name: type
          in: path
      responses:
        "200":
          description: Successfully retrieved follow list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFollowStatusResponse"
        "400":
          description: Error retrieving following or follower list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "403":
          description: "Error retrieving following or follower list: User is private"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "404":
          description: "Error retrieving following or follower list: User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /follows/requests:
    get:
      description: Get follow requests
      responses:
        "200":
          description: Successfully retrieved requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFollowRequestsResponse"
        "400":
          description: Error retrieving requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseMessage"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /itineraries:
    post:
      description: Create an itinerary
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                startDate:
                  $ref: "#/components/schemas/Date"
                endDate:
                  $ref: "#/components/schemas/Date"
                itineraryItems:
                  type: array
                  items:
                    $ref: "#/components/schemas/ItineraryItemInput"
              required:
                - title
                - itineraryItems
      responses:
        "201":
          description: Itinerary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateItineraryResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /itineraries/{id}:
    get:
      description: Get an itinerary via id
      parameters:
        - schema:
            type: string
            format: cuid
            description: User ID
          required: true
          description: User ID
          name: id
          in: path
      responses:
        "200":
          description: Got itinerary
